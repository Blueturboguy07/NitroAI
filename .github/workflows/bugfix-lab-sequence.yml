name: bugfix-lab-sequence

# Controlled Windows environment for cluster
# nitroai-windows-electron-binary-download-stuck. Runs publik's NitroAI Windows
# guide commands in ONE PowerShell session, the way a reader does, and reports
# whether that session ever gets to finish the "Build the installer" step.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "today = live guide v11 step order | v3 = the guide version live at the reports' timestamps"
        required: true
        default: today
        type: choice
        options: [today, v3]

jobs:
  guide-shell-sequence:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Environment
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
      - name: Run the guide in one PowerShell session
        shell: pwsh
        run: |
          & .\scripts\bugfix-lab\nitroai-guide-shell-sequence.ps1 -Mode '${{ inputs.mode }}'
          exit $LASTEXITCODE
