# Updater proof: on real macOS runners (Apple silicon and Intel) and a real Windows runner, builds two TEST
# versions of NitroAI (N and N+1, both with "publikUpdaterTest": true in package.json, which no release
# has), installs N, puts N+1 and its signed feed (signed with the real publik update key) on a GitHub
# PRERELEASE with a test tag (v0.0.0-updtest.*), and runs .github/scripts/updater-proof.cjs:
#   - refused feeds (served from 127.0.0.1): one byte of the feed changed, signed by another key, no
#     signature, an installer with one byte changed, and on macOS N+1 re-signed by another identity.
#     For each one, N must refuse and stay N.
#   - the good feed (the prerelease, absolute asset URLs): N must verify the signature, download the
#     installer for its machine, check its sha512, install it, and the installed app must then report N+1.
# The prereleases and their tags are deleted at the end of each job, pass or fail.
#
# macOS: N and N+1 are built ONCE (job mac-build) the way release.yml builds a release: signed with the
# repo's Developer ID certificate (CSC_LINK), hardened runtime, and notarized + stapled by electron-builder
# (APPLE_* secrets). The arm64 and x64 zips are then proved on an arm64 runner and on an Intel runner. Only
# the refused "other identity" case uses an identity made on the runner. A push whose commit message holds
# [proof-no-notarize] (or a manual run with notarize off) skips notarization to save time.
#
# workflow_dispatch needs this file on the default branch; until it is there, a push to feat/updater runs it.
name: Updater proof

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the macOS test builds (the real release path)
        type: boolean
        default: true
  push:
    branches: ['feat/updater']

permissions:
  contents: write # creates, then deletes, the test prereleases

concurrency:
  group: updater-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  DO_NOT_TRACK: '1'
  PUBLIK_UPDATES: '0'
  NOTARIZE: ${{ (github.event_name == 'workflow_dispatch' && inputs.notarize) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[proof-no-notarize]')) }}
  V_OLD: 0.0.0-updtest.${{ github.run_number }}.${{ github.run_attempt }}.1
  V_NEW: 0.0.0-updtest.${{ github.run_number }}.${{ github.run_attempt }}.2

jobs:
  unit:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      # Signatures from the reference minisign tool, in both forms the app accepts: legacy (`minisign -S -l`,
      # Ed25519 over the file) and prehashed (`minisign -S`, Ed25519 over BLAKE2b-512). Checked here with
      # Node's crypto, then on the macOS and Windows runners with Electron's own crypto.
      - name: Cross-check with the reference minisign tool
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq minisign > /dev/null
          minisign -v || true
          d=minisign-vectors; mkdir -p $d/legacy $d/prehashed
          minisign -G -W -p $d/minisign.pub -s "$RUNNER_TEMP/minisign.key"
          for form in legacy prehashed; do cp test/fixtures/update-feed/latest.yml $d/$form/latest.yml; done
          minisign -S -l -s "$RUNNER_TEMP/minisign.key" -m $d/legacy/latest.yml -x $d/legacy/latest.yml.sig
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m $d/prehashed/latest.yml -x $d/prehashed/latest.yml.sig
          rm -f "$RUNNER_TEMP/minisign.key"
          for form in legacy prehashed; do
            minisign -V -p $d/minisign.pub -m $d/$form/latest.yml -x $d/$form/latest.yml.sig
            node scripts/publik-update-feed.cjs verify $d/$form/latest.yml --public-key $d/minisign.pub
            sed -n 2p $d/$form/latest.yml.sig | base64 -d | head -c 2; echo " <- $form signature algorithm"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: minisign-vectors
          path: minisign-vectors
          retention-days: 7

  windows:
    name: Windows — N updates to N+1 (NSIS, unsigned)
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAG: v0.0.0-updtest.${{ github.run_number }}.${{ github.run_attempt }}-win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: minisign-vectors
          path: minisign-vectors

      - name: The signature check under Electron's own crypto (tauri, minisign legacy, minisign prehashed)
        run: |
          node -e "require('electron')" > /dev/null # the electron package downloads its binary on first use
          ELECTRON_RUN_AS_NODE=1 "$(node -p "require('electron')")" .github/scripts/updater-electron-crypto.cjs minisign-vectors

      # The test hook runs before Sign in with publik, so the test builds do not need the publik app token.
      - name: Build the UI
        run: npm run build

      - name: Build N and N+1 (test builds)
        run: |
          set -euo pipefail
          npm pkg set publikUpdaterTest=true --json
          npm pkg set version="$V_OLD"
          npx electron-builder --win --x64 --publish never -c.directories.output=release-old
          npm pkg set version="$V_NEW"
          npx electron-builder --win --x64 --publish never -c.directories.output=release-new
          ls -la release-old release-new

      - name: Check the test build carries the updater
        run: |
          set -euo pipefail
          res=release-old/win-unpacked/resources
          npx asar list "$res/app.asar" | tr '\\' '/' > asar-list.txt
          for f in /electron/publik-updater.cjs /electron/publik-update-verify.cjs /node_modules/electron-updater/package.json /node_modules/blakejs/package.json; do grep -x "$f" asar-list.txt; done
          node -e 'const p = JSON.parse(require("@electron/asar").extractFile(process.argv[1], "package.json")); if (p.publikUpdaterTest !== true) process.exit(1); console.log("package.json:", p.version, "publikUpdaterTest:", p.publikUpdaterTest)' "$res/app.asar"
          cat "$res/app-update.yml"

      - name: Install N with its own installer
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path "release-old/NitroAI-Setup-Windows.exe").Path -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          Get-Process NitroAI -ErrorAction SilentlyContinue | Stop-Process -Force
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles") | Where-Object { Test-Path $_ }
          $exe = Get-ChildItem -Path $roots -Filter "NitroAI.exe" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { throw "installed NitroAI.exe not found" }
          Write-Host "installed: $($exe.FullName)"
          "NITROAI_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Put N+1 on a test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Updater proof $TAG (test build, deleted after the run)" \
            --notes "CI test of the self-updater (updater-proof.yml). Not a release. Deleted when the run ends." \
            "release-new/NitroAI-Setup-Windows.exe"

      # The same command update-feed.yml runs for a real release: reads the release, checks the version inside
      # the installer, writes latest.yml with absolute asset URLs, signs it with the real update key, verifies
      # it, uploads latest.yml + .sig.
      - name: Make the signed feed with the release script (real update key)
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIK_UPDATE_KEY: ${{ secrets.PUBLIK_UPDATE_KEY }}
          PUBLIK_UPDATE_KEY_PASSWORD: ${{ secrets.PUBLIK_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/publik-update-feed.cjs release --tag "$TAG" --version "$V_NEW" --app nitroai --repo "$GITHUB_REPOSITORY"
          gh release download "$TAG" --pattern latest.yml --pattern latest.yml.sig --dir feed-good
          node scripts/publik-update-feed.cjs verify feed-good/latest.yml
          cat feed-good/latest.yml

      - name: Make the refused feeds
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIK_UPDATE_KEY: ${{ secrets.PUBLIK_UPDATE_KEY }}
          PUBLIK_UPDATE_KEY_PASSWORD: ${{ secrets.PUBLIK_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"
          onebyte="NitroAI-Setup-Windows-onebyte.exe"
          mkdir -p assets
          node .github/scripts/updater-proof.cjs one-byte --src "release-new/NitroAI-Setup-Windows.exe" --dst "assets/$onebyte"
          gh release upload "$TAG" "assets/$onebyte"
          node .github/scripts/updater-proof.cjs prepare --good feed-good --feed latest.yml --onebyte-url "$base$onebyte" --onebyte-of NitroAI-Setup-Windows.exe --out cases

      - name: Proof (N refuses the bad feeds, then updates to N+1)
        timeout-minutes: 30
        run: |
          node .github/scripts/updater-proof.cjs run --app "$NITROAI_EXE" --old "$V_OLD" --new "$V_NEW" \
            --good-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --expect-file NitroAI-Setup-Windows.exe \
            --cases cases --out proof-logs/updater-proof-windows.json --logs proof-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-proof-windows
          path: |
            proof-logs
            feed-good/latest.yml
            cases
          if-no-files-found: warn
          retention-days: 14

      - name: Delete the test prerelease and its tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG still exists"; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1; then echo "tag $TAG still exists"; exit 1; fi
          echo "deleted $TAG"

  mac-build:
    name: macOS — build N and N+1 (Developer ID, as release.yml)
    needs: unit
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: minisign-vectors
          path: minisign-vectors

      - name: The signature check under Electron's own crypto (tauri, minisign legacy, minisign prehashed)
        run: |
          node -e "require('electron')" > /dev/null # the electron package downloads its binary on first use
          ELECTRON_RUN_AS_NODE=1 "$(node -p "require('electron')")" .github/scripts/updater-electron-crypto.cjs minisign-vectors

      # The same keychain as release.yml: the Developer ID certificate and Apple's intermediates. A missing
      # certificate stops the proof (it proves the real signing path, not an ad-hoc one).
      - name: Set up macOS code signing (Developer ID)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then echo "::error::CSC_LINK is not set"; exit 1; fi
          KEYCHAIN="$RUNNER_TEMP/nitroai-signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import build-resources/apple-developer-id-intermediates.pem -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application' || { echo "::error::no Developer ID Application identity"; exit 1; }
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MAC_SIGN=1" >> "$GITHUB_ENV"

      - name: Build the UI
        run: npm run build

      # electron-builder signs each app with the Developer ID and the hardened runtime, notarizes it and
      # staples the ticket (when NOTARIZE is true), then makes the zips (and for N+1 the dmgs too, like a release).
      - name: Build N (zips) and N+1 (dmgs + zips), arm64 and x64
        env:
          APPLE_ID: ${{ env.NOTARIZE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.NOTARIZE == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.NOTARIZE == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          echo "notarize: $NOTARIZE"
          npm pkg set publikUpdaterTest=true --json
          npm pkg set version="$V_OLD"
          npx electron-builder --mac zip --arm64 --x64 --publish never -c.directories.output=release-old
          npm pkg set version="$V_NEW"
          npx electron-builder --mac --publish never -c.directories.output=release-new
          ls -la release-old release-new

      - name: Check the test builds carry the updater, the Developer ID signature and the ticket
        run: |
          set -euo pipefail
          for app in release-old/mac-arm64/NitroAI.app release-old/mac/NitroAI.app release-new/mac-arm64/NitroAI.app release-new/mac/NitroAI.app; do
            echo "== $app"
            npx asar list "$app/Contents/Resources/app.asar" > asar-list.txt
            for f in /electron/publik-updater.cjs /electron/publik-update-verify.cjs /node_modules/electron-updater/package.json /node_modules/blakejs/package.json; do grep -x "$f" asar-list.txt; done
            node -e 'const p = JSON.parse(require("@electron/asar").extractFile(process.argv[1], "package.json")); if (p.publikUpdaterTest !== true) process.exit(1); console.log("package.json:", p.version, "publikUpdaterTest:", p.publikUpdaterTest)' "$app/Contents/Resources/app.asar"
            cat "$app/Contents/Resources/app-update.yml"
            lipo -archs "$app/Contents/MacOS/NitroAI"
            codesign -dvv "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Runtime)'
            codesign -dvv "$app" 2>&1 | grep -q '^Authority=Developer ID Application' || { echo "::error::$app is not signed with a Developer ID"; exit 1; }
            codesign -d -r- "$app" 2>&1 | grep designated
            codesign --verify --deep --strict "$app" && echo "codesign: valid"
            if [ "$NOTARIZE" = true ]; then xcrun stapler validate "$app"; fi
          done
          ls -la release-old/*.zip release-new/*.zip release-new/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: updater-proof-mac-builds
          path: |
            release-old/*.zip
            release-new/*.zip
            release-new/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/nitroai-signing.keychain-db" || true

  macos:
    name: macOS ${{ matrix.arch }} — N updates to N+1 (Squirrel.Mac, Developer ID)
    needs: mac-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            uname: arm64
          - arch: x64
            runner: macos-15-intel
            uname: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TAG: v0.0.0-updtest.${{ github.run_number }}.${{ github.run_attempt }}-mac-${{ matrix.arch }}
      ZIP: NitroAI-mac-${{ matrix.arch }}.zip
      OTHER_ID: NitroAI Other Identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: This runner is ${{ matrix.uname }}
        run: |
          uname -m; sysctl -n machdep.cpu.brand_string || true
          [ "$(uname -m)" = "${{ matrix.uname }}" ]

      - uses: actions/download-artifact@v4
        with:
          name: updater-proof-mac-builds
          path: .

      # One self-signed code-signing identity in a keychain of this run, trusted for code signing on this
      # runner only. It re-signs a copy of N+1 for the refused case. N and N+1 carry the Developer ID.
      - name: Make another code-signing identity (this runner only)
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/updtest.keychain-db"
          KCPASS="$(/usr/bin/openssl rand -hex 16)"
          P12PASS="$(/usr/bin/openssl rand -hex 16)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          d="$RUNNER_TEMP/id-other"; mkdir -p "$d"
          printf '[req]\ndistinguished_name=dn\nx509_extensions=ext\nprompt=no\n[dn]\nCN=%s\n[ext]\nbasicConstraints=critical,CA:false\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' "$OTHER_ID" > "$d/req.cnf"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config "$d/req.cnf" -keyout "$d/key.pem" -out "$d/cert.pem" 2>/dev/null
          /usr/bin/openssl pkcs12 -export -inkey "$d/key.pem" -in "$d/cert.pem" -name "$OTHER_ID" -out "$d/id.p12" -passout "pass:$P12PASS"
          security import "$d/id.p12" -k "$KC" -P "$P12PASS" -T /usr/bin/codesign >/dev/null
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$d/cert.pem"
          rm -f "$d/key.pem" "$d/id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          echo "KC=$KC" >> "$GITHUB_ENV"

      - name: Install N for this machine (unzip into ~/Applications, as Squirrel.Mac would)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Applications"
          rm -rf "$HOME/Applications/NitroAI.app"
          ditto -x -k "release-old/$ZIP" "$HOME/Applications/"
          lipo -archs "$HOME/Applications/NitroAI.app/Contents/MacOS/NitroAI"
          echo "NITROAI_APP=$HOME/Applications/NitroAI.app" >> "$GITHUB_ENV"

      - name: Put N+1 on a test prerelease (both zips and both dmgs, like a release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Updater proof $TAG (test build, deleted after the run)" \
            --notes "CI test of the self-updater (updater-proof.yml). Not a release. Deleted when the run ends." \
            release-new/NitroAI-mac-arm64.zip release-new/NitroAI-mac-x64.zip release-new/NitroAI-mac-arm64.dmg release-new/NitroAI-mac-x64.dmg

      # The same command update-feed.yml runs for a real release (see the Windows job).
      - name: Make the signed feed with the release script (real update key)
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIK_UPDATE_KEY: ${{ secrets.PUBLIK_UPDATE_KEY }}
          PUBLIK_UPDATE_KEY_PASSWORD: ${{ secrets.PUBLIK_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/publik-update-feed.cjs release --tag "$TAG" --version "$V_NEW" --app nitroai --repo "$GITHUB_REPOSITORY"
          gh release download "$TAG" --pattern latest-mac.yml --pattern latest-mac.yml.sig --dir feed-good
          node scripts/publik-update-feed.cjs verify feed-good/latest-mac.yml
          cat feed-good/latest-mac.yml

      - name: Make the refused feeds
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIK_UPDATE_KEY: ${{ secrets.PUBLIK_UPDATE_KEY }}
          PUBLIK_UPDATE_KEY_PASSWORD: ${{ secrets.PUBLIK_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"
          zip="release-new/$ZIP"
          mkdir -p assets other
          onebyte="NitroAI-mac-${{ matrix.arch }}-onebyte.zip"
          node .github/scripts/updater-proof.cjs one-byte --src "$zip" --dst "assets/$onebyte"
          # N+1 re-signed with OTHER_ID: same bundle, same version, another code-signing identity
          ditto -x -k "$zip" other/
          codesign --force --deep --options runtime --timestamp=none --entitlements build-resources/entitlements.mac.plist --keychain "$KC" --sign "$OTHER_ID" other/NitroAI.app
          codesign --verify --deep --strict other/NitroAI.app && codesign -dvv other/NitroAI.app 2>&1 | grep -E '^Authority'
          otherzip="assets/NitroAI-mac-${{ matrix.arch }}-otheridentity.zip"
          ditto -c -k --sequesterRsrc --keepParent other/NitroAI.app "$otherzip"
          gh release upload "$TAG" "assets/$onebyte" "$otherzip"
          node scripts/publik-update-feed.cjs write --app nitroai --version "$V_NEW" --download-base "$base" --mac-zip "$otherzip" --out feed-otherid
          node .github/scripts/updater-proof.cjs prepare --good feed-good --feed latest-mac.yml --onebyte-url "$base$onebyte" --onebyte-of "$ZIP" --other-identity feed-otherid --out cases

      - name: Proof (N refuses the bad feeds, then updates to N+1)
        timeout-minutes: 35
        run: |
          node .github/scripts/updater-proof.cjs run --app "$NITROAI_APP/Contents/MacOS/NitroAI" --bundle "$NITROAI_APP" \
            --old "$V_OLD" --new "$V_NEW" --good-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --expect-file "$ZIP" --developer-id 1 --notarized "$([ "$NOTARIZE" = true ] && echo 1 || echo 0)" \
            --cases cases --out proof-logs/updater-proof-macos-${{ matrix.arch }}.json --logs proof-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-proof-macos-${{ matrix.arch }}
          path: |
            proof-logs
            feed-good/latest-mac.yml
            cases
          if-no-files-found: warn
          retention-days: 14

      - name: Delete the test prerelease and its tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG still exists"; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1; then echo "tag $TAG still exists"; exit 1; fi
          echo "deleted $TAG"

      - name: Remove the keychain of this run
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/updtest.keychain-db" || true
