name: Build desktop installers

# Produces the downloadable Mac (.dmg), Windows (.exe), and Linux (.AppImage)
# installers, and the Mac update zips (.zip, what the self-updater installs).
# Then the update feed (update-feed.yml): latest.yml / latest-mac.yml with
# their signatures, made from the files on the release and signed with the
# publik update key (docs/updates.md).
# A version tag starts it. Cut a release with ONE command,
# `scripts/publik-release.sh X.Y.Z` (docs/updates.md › Cut a release): it bumps
# the version, pushes the tag, waits for this workflow, downloads every file of
# the DRAFT release this workflow makes, checks them, and only then publishes
# the release. This workflow never publishes: the release stays a draft until
# the script's checks pass. It can also run manually from the Actions tab
# (build only, no release).

on:
  push:
    tags:
      - "v*"
      - "!v*-updtest*" # v0.0.0-updtest.* tags belong to updater-proof.yml test runs
  workflow_dispatch:

permissions:
  contents: write

# publik telemetry is off on build machines: a test run is not a user. A
# build machine does not check for updates either.
env:
  DO_NOT_TRACK: "1"
  PUBLIK_UPDATES: "0"

jobs:
  # A release that already holds files for this tag must never be overwritten.
  # That is the case when a draft release with checked, notarized installers is
  # published: publishing creates the tag, the tag starts this workflow, and
  # the upload below would replace the checked files with fresh, unchecked
  # ones. So: files already there for the tag → build nothing, upload nothing.
  # A tag with no release yet (scripts/publik-release.sh pushes one) builds and
  # puts the files on a draft release. If the check itself fails, the jobs
  # below do not run.
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Not a tag: build only (no release is published from a branch)."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .assets | length" \
            | awk '{ total += $1 } END { print total + 0 }')"
          if [ "$files" -gt 0 ]; then
            echo "::notice::A release for $GITHUB_REF_NAME already holds $files file(s). Nothing is built and nothing is uploaded."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release files for $GITHUB_REF_NAME yet: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build a dedicated signing keychain containing the Developer ID cert AND
      # Apple's Developer ID intermediate — a .p12 alone has only the leaf, so
      # without the intermediate the chain is "not trusted" and electron-builder
      # silently skips signing. Runs only when the cert secret is present; a
      # fork without it falls through to the ad-hoc build. Only this step sees
      # CSC_LINK/CSC_KEY_PASSWORD, so the build step won't spin up its own
      # (untrusted) temp keychain.
      - name: Set up macOS code signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No signing certificate configured — building ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/nitroai-signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Apple Developer ID intermediates (checked into the repo) complete the
          # trust chain — a .p12 has only the leaf. Both G1 and G2 are imported;
          # the leaf is issued by whichever one, so this resolves it either way.
          security import build-resources/apple-developer-id-intermediates.pem -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so signing finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MAC_SIGN=1" >> "$GITHUB_ENV"

      # publik API default: the app token is baked into the bundle by
      # electron-builder's extraMetadata (see electron-builder.cjs). A tag
      # build without it still succeeds but ships without the publik option,
      # so say so loudly instead of silently producing a BYO-only release.
      - name: Check publik app token
        shell: bash
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          if [ -z "${PUBLIK_APP_TOKEN:-}" ]; then
            echo "::warning::PUBLIK_APP_TOKEN secret is not set — this build will not offer publik API (Local + own key only)."
          else
            echo "publik app token present (not printed)."
          fi

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the packaged package.json (extraMetadata.publik.appToken).
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
          # macOS signing uses the keychain set up above (CSC_KEYCHAIN/MAC_SIGN);
          # CSC_LINK is deliberately NOT passed here. Notarization reads the
          # Apple credentials. Windows Authenticode signing activates if the
          # WIN_* secrets are set. All optional — absent = ad-hoc/unsigned.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # electron-builder notarizes and staples the .app, but the dmg it wraps
      # around it is never submitted, so a downloaded dmg has no ticket of its
      # own and Gatekeeper has to ask Apple at open time — which fails offline.
      # Observed on v0.2.1: the app validated, the dmg answered "does not have
      # a ticket stapled to it". Submitting the finished dmg is quick (its
      # contents are already notarized) and makes the download self-contained.
      # The dmg is signed with the Developer ID first: an unsigned dmg (v0.2.7)
      # is notarized, but `spctl -a -t open --context context:primary-signature`
      # rejects it ("no usable signature"). Signed, it is "Notarized Developer ID".
      - name: Sign, notarize and staple the dmg
        if: matrix.os == 'macos-latest' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          [ -n "${CSC_KEYCHAIN:-}" ] || { echo "::error::no signing keychain: the dmg cannot be signed"; exit 1; }
          id="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk '/"Developer ID Application/ { print $2; exit }')"
          [ -n "$id" ] || { echo "::error::no Developer ID Application identity"; exit 1; }
          for dmg in release/*.dmg; do
            echo "signing $dmg"
            codesign --sign "$id" --keychain "$CSC_KEYCHAIN" --timestamp "$dmg"
            codesign --verify --verbose=2 "$dmg"
            echo "notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -t open --context context:primary-signature -vv "$dmg" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
            grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt" || { echo "::error::Gatekeeper does not accept $dmg"; exit 1; }
          done

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nitroai-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: warn

  release:
    needs: [guard, build]
    if: startsWith(github.ref, 'refs/tags/') && needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # A DRAFT: scripts/publik-release.sh downloads it back, checks every file
      # and publishes it only when all checks pass.
      - name: Put the files on a draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true

  # The signed update feed for this tag: latest.yml (Windows installer) and
  # latest-mac.yml (the arm64 and x64 zips, then the dmgs), each with its .sig,
  # added to the draft.
  # It adds only the feed files that are missing and never replaces an
  # installer. It also runs when the guard found files already on the release
  # (a published publik draft), so a draft that missed "Update feed" gets it.
  feed:
    name: Update feed
    needs: [guard, release]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.guard.result == 'success' && (needs.release.result == 'success' || needs.guard.outputs.build == 'false') }}
    uses: ./.github/workflows/update-feed.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
